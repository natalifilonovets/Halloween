<!doctype html><meta charset="utf-8"><title>Secret card checks</title><style>body{margin:0}iframe{width:100vw;height:100vh;border:0}pre{position:fixed;top:0;background:white;color:black;z-index:99}</style><iframe src="../index.html"></iframe><script>
if(location.search.includes('visual'))document.write('<style>pre{display:none}</style>');
const frame=document.querySelector('iframe');frame.onload=async()=>{
 const w=frame.contentWindow,d=w.document,checks=[];
 const check=(name,ok)=>checks.push({name,ok:!!ok});
 w.eval("state={...fresh(),screen:'card-table',station:'facts',activeCard:'mummy',cardDeck:monsters.filter(m=>m.id!=='mummy').map(m=>m.id)};render()");
 await new Promise(r=>setTimeout(r,700));
 for(const id of ['mummy','invisible-man','frankenstein-monster','werewolf','witch','ghost','zombie','vampire']){
  w.eval(`state.activeCard='${id}';render()`);
  const copy=d.querySelector('.secret-card-copy'),face=d.querySelector('.secret-card-face'),facts=d.querySelector('.secret-facts');
  check(id+' copy fits',copy.getBoundingClientRect().right<face.getBoundingClientRect().right);
  check(id+' facts fit',facts.scrollHeight<=facts.clientHeight);
  check(id+' next waits',d.querySelector('#keep-card').disabled);
 }
 const c=d.querySelector('canvas'),r=c.getBoundingClientRect();
 const pointer=(type,x,y)=>c.dispatchEvent(new w.PointerEvent(type,{clientX:r.left+x*r.width,clientY:r.top+y*r.height,pointerId:1,button:0,bubbles:true}));
 // Synthetic pointers cannot acquire capture; invoke the actual handlers with a capture stub.
 c.setPointerCapture=()=>{};
 pointer('pointerdown',.5,.5);pointer('pointermove',.55,.5);pointer('pointerup',.55,.5);
 check('short stroke keeps cover',!c.hidden);check('short stroke does not unlock next',d.querySelector('#keep-card').disabled);
 d.querySelector('#accessible-reveal').click();
 check('explicit reveal shows clues',c.hidden);check('explicit reveal unlocks next',!d.querySelector('#keep-card').disabled);
 await new Promise(r=>setTimeout(r,8500));
 check('card remains after eight seconds',!!d.querySelector('.secret-card-face'));
 const report=document.createElement('pre');report.id='results';report.textContent=JSON.stringify(checks,null,2);document.body.append(report);
};</script>
